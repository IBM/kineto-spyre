name: Release wheel build and validation

on:
  push:
    tags:
      - 'kineto-2.11*'
  workflow_dispatch:
    inputs:
      libaiupti_install_dir:
        description: 'Absolute path to libaiupti installation on the runner'
        required: true
        default: '/opt/libaiupti'

jobs:
  release-wheel:
    runs-on: [self-hosted, linux, x64, aiu]
    timeout-minutes: 360
    env:
      LIBAIUPTI_INSTALL_DIR: ${{ github.event.inputs.libaiupti_install_dir || '/opt/libaiupti' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git build-essential

      - name: Verify AIUPTI path is configured
        run: |
          if [ ! -d "${LIBAIUPTI_INSTALL_DIR}" ]; then
            echo "Missing LIBAIUPTI_INSTALL_DIR=${LIBAIUPTI_INSTALL_DIR}"
            exit 1
          fi

      - name: Build PyTorch wheel with Kineto Spyre
        run: |
          chmod +x ./scripts/build_pytorch.sh
          ./scripts/build_pytorch.sh

      - name: Validate wheel exists
        run: |
          compgen -G "/project_src/pytorch/dist/*.whl" > /dev/null || {
            echo "No wheel produced in /project_src/pytorch/dist/"
            exit 1
          }

      - name: Validate build log exists
        run: |
          test -f /project_src/pytorch/build.log || {
            echo "Missing build log at /project_src/pytorch/build.log"
            exit 1
          }

      - name: Validate AIUPTI was detected
        run: |
          grep -E "AIU_INCLUDE_DIR|AIU_LIBRARY|Building with aiupti|HAS_AIUPTI" /project_src/pytorch/build.log > /dev/null || {
            echo "AIUPTI validation failed: expected markers not found in build.log"
            exit 1
          }

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kineto-spyre-wheel
          path: /project_src/pytorch/dist/*.whl

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: kineto-spyre-build-log
          path: /project_src/pytorch/build.log
